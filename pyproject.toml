[project]
name = "loan-wizard"
version = "0.1.0"
description = "Reference implementation for the resumable loan application wizard Validated Pattern"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "temporalio>=1.8",
    "fastapi>=0.110",
    "uvicorn>=0.30",
    "pydantic>=2.7",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.6",
]

# This is a runnable reference application, not a distributable package, so uv
# manages the environment without building or installing the project itself.
[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["web"]

[tool.ruff.lint]
# pyflakes (F), pycodestyle (E/W), pyupgrade (UP), bugbear (B). isort (I) is
# intentionally omitted: the imports are grouped compactly by hand (and mirrored
# in the design guide's code listings), which the linter should not reflow.
select = ["E", "W", "F", "UP", "B"]
